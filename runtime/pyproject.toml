[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verity-testimony"
version = "0.0.1"
description = "Truth values that explain themselves: the Verity testimony runtime, usable from plain Python."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "Henrik Gombos" },
    { name = "Pranav Balakrishnan" },
]
keywords = ["testing", "assertions", "explanations", "validation", "agents"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://www.verity.garden"
Documentation = "https://www.verity.garden/book/cover.html"
Source = "https://github.com/Henrik66/verity"

[tool.setuptools]
py-modules = ["testimony", "string_ops"]
